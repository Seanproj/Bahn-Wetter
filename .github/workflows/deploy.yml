name: Build & deploy site

# Builds the static site, renders today's share card into it and deploys to GitHub Pages.
# Runs daily so the card (and the site's "today") stays fresh even when the data does not change.
# Pull requests build and render the card as a check, without deploying.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 03:47 UTC = 04:47 (CET) / 05:47 (CEST) in Berlin — the card date is the same calendar day either way.
    - cron: "47 3 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (the data refresh passes main to pick up its own commit)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        working-directory: site
        run: |
          npm ci
          npm run build

      - uses: astral-sh/setup-uv@v7

      - name: Check Python sources compile
        run: uv run --no-project python -m py_compile pipeline/*.py cards/*.py

      - name: Run tests
        run: uv run pytest -q tests

      # The Korean font comes from a slow apt mirror (61 MB, at times several minutes), so keep it in the
      # Actions cache: only a cache miss pays for apt.
      - name: Restore card font
        id: font-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.local/share/fonts/noto-cjk
          key: noto-cjk-v1

      # The share card is a bonus: a stalled apt mirror must not block the site deploy.
      - name: Install card fonts and browser
        id: card-deps
        continue-on-error: true
        timeout-minutes: 10
        env:
          FONT_HIT: ${{ steps.font-cache.outputs.cache-hit }}
        run: |
          # Each apt call is time-capped and traced, so a stall shows where it is. Skip man-db rebuilds.
          set -x
          pkgs=""
          [ "$FONT_HIT" = "true" ] || pkgs="fonts-noto-cjk"
          fc-list | grep -qi "Noto Color Emoji" || pkgs="$pkgs fonts-noto-color-emoji"
          if [ -n "$pkgs" ]; then
            sudo rm -f /var/lib/man-db/auto-update
            sudo timeout 120 apt-get update -q -o DPkg::Lock::Timeout=60
            sudo DEBIAN_FRONTEND=noninteractive timeout 420 apt-get install -y -q --no-install-recommends \
              -o DPkg::Lock::Timeout=60 $pkgs
          fi
          if [ "$FONT_HIT" != "true" ]; then
            mkdir -p ~/.local/share/fonts/noto-cjk
            cp /usr/share/fonts/opentype/noto/NotoSansCJK-*.ttc ~/.local/share/fonts/noto-cjk/
          fi
          fc-cache -f ~/.local/share/fonts
          fc-list :lang=ko | grep -q .  # a Korean font must be there, or the card would show boxes
          uv sync --group cards
          # Use the runner's preinstalled Chrome when there is one; downloading Chromium needs apt deps too.
          if chrome=$(command -v google-chrome || command -v google-chrome-stable); then
            echo "CHROMIUM_PATH=$chrome" >> "$GITHUB_ENV"
          else
            uv run --group cards playwright install --with-deps chromium
          fi

      - name: Save card font
        if: steps.card-deps.outcome == 'success' && steps.font-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.local/share/fonts/noto-cjk
          key: noto-cjk-v1

      - name: Render today's share card
        if: steps.card-deps.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          day=$(TZ=Europe/Berlin date +%F)
          uv run --group cards python cards/make_card.py --date "$day" --out "site/dist/cards/$day.png"
          cp "site/dist/cards/$day.png" site/dist/cards/latest.png

      # Never publish a site without cards/latest.png (links and previews point at it): if today's card could
      # not be rendered, carry over the one that is live now.
      - name: Keep the published card if today's is missing
        if: github.event_name != 'pull_request'
        run: |
          [ -f site/dist/cards/latest.png ] && exit 0
          mkdir -p site/dist/cards
          url="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/cards/latest.png"
          if curl -fsSL --max-time 30 "$url" -o site/dist/cards/latest.png; then
            echo "::warning::today's card was not rendered; kept the published one"
          else
            rm -f site/dist/cards/latest.png
            echo "::warning::today's card was not rendered and none is published; the site falls back to #/card"
          fi

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
