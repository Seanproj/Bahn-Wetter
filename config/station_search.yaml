# Search patterns (ILIKE) for target stations. Not EVAs — explore.py resolves these against
# the real data and writes config/stations.yaml.
# Patterns are matched case-insensitively against station_name; each pattern resolves to its most
# frequent station name. An entry with `patterns` merges several stations into one key (e.g. the
# airport's regional and long-distance stations).
hub:
  - key: frankfurt_hbf
    pattern: "Frankfurt (Main) Hbf%"
corridor:   # HANDOFF §4.1, north → south
  - {key: frankfurt_hbf,       pattern: "Frankfurt (Main) Hbf%"}
  - {key: frankfurt_sued,      pattern: "Frankfurt (Main) S_d%"}
  - {key: frankfurt_louisa,    pattern: "Frankfurt%Louisa%"}
  - {key: neu_isenburg,        pattern: "Neu%Isenburg%"}
  - {key: dreieich_buchschlag, pattern: "Dreieich%Buchschlag%"}
  - {key: langen,              pattern: "Langen (Hess%"}
  - {key: egelsbach,           pattern: "Egelsbach%"}
  - {key: erzhausen,           pattern: "Erzhausen%"}
  - {key: darmstadt_wixhausen, pattern: "Darmstadt%Wixhausen%"}
  - {key: darmstadt_arheilgen, pattern: "Darmstadt%Arheilgen%"}
  - {key: darmstadt_hbf,       pattern: "Darmstadt Hbf%"}

destinations:   # other route endpoints (Phase 6), chosen by daily runs from Frankfurt Hbf
  - key: frankfurt_flughafen
    patterns: ["Frankfurt (Main) Flughafen Regionalbahnhof%", "Frankfurt am Main Flughafen Fernbahnhof%"]
  - {key: wiesbaden_hbf, pattern: "Wiesbaden Hbf%"}
  - {key: mainz_hbf,     pattern: "Mainz Hbf%"}
  - {key: hanau_hbf,     pattern: "Hanau Hbf%"}

# Routes are Frankfurt Hbf ↔ `to`. `code` builds the direction keys (ffm_<code>, <code>_ffm);
# `label` is the short UI name. Order = order in the UI; the first route is the share card's.
routes:
  - {code: da,  to: darmstadt_hbf,       label: "Darmstadt"}
  - {code: fra, to: frankfurt_flughafen, label: "공항"}
  - {code: wi,  to: wiesbaden_hbf,       label: "Wiesbaden"}
  - {code: mz,  to: mainz_hbf,           label: "Mainz"}
  - {code: ha,  to: hanau_hbf,           label: "Hanau"}
